 name: Self-hosted Runner Smoke Test                                                                                                                                                                                                      
                                                                                                                                                                                                                                            
   on:                                                                                                                                                                                                                                      
     push:                                                                                                                                                                                                                                  
     workflow_dispatch:                                                                                                                                                                                                                     
                                                                                                                                                                                                                                            
   jobs:                                                                                                                                                                                                                                    
     smoke-test:                                                                                                                                                                                                                            
       runs-on: self-hosted                                                                                                                                                                                                                 
       steps:                                                                                                                                                                                                                               
         - name: Check machine                                                                                                                                                                                                              
           run: |                                                                                                                                                                                                                           
             echo "hostname: $(hostname)"                                                                                                                                                                                                   
             echo "arch: $(uname -m)"                                                                                                                                                                                                       
             echo "os: $(uname -s)"                                                                                                                                                                                                         
         - name: Simple test                                                                                                                                                                                                                
           run: |                                                                                                                                                                                                                           
             echo "start test..."                                                                                                                                                                                                           
             if [ "$(uname -m)" = "loongarch64" ]; then                                                                                                                                                                                     
               echo "PASS: running on loongarch64"                                                                                                                                                                                          
             else                                                                                                                                                                                                                           
               echo "WARN: not loongarch64"                                                                                                                                                                                                 
             fi                                                                                                                                                                                                                             
             echo "test passed" 
