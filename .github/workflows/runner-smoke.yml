 name: Self-hosted Runner Smoke Test                                                                                                                                                                                                      
                                                                                                                                                                                                                                            
   on:                                                                                                                                                                                                                                      
     push:                # push 到仓库就触发                                                                                                                                                                                               
     workflow_dispatch:   # 也可以手动在 Actions 页面点 "Run workflow"                                                                                                                                                                      
                                                                                                                                                                                                                                            
   jobs:                                                                                                                                                                                                                                    
     smoke-test:                                                                                                                                                                                                                            
       runs-on: self-hosted          # 关键：指定用你自己的 runner                                                                                                                                                                          
       steps:                                                                                                                                                                                                                               
         - name: 确认跑在哪台机器                                                                                                                                                                                                           
           run: |                                                                                                                                                                                                                           
             echo "hostname : $(hostname)"                                                                                                                                                                                                  
             echo "arch     : $(uname -m)"                                                                                                                                                                                                  
             echo "os       : $(uname -s)"                                                                                                                                                                                                  
                                                                                                                                                                                                                                            
         - name: 简单测试                                                                                                                                                                                                                   
           run: |                                                                                                                                                                                                                           
             echo "开始测试..."                                                                                                                                                                                                             
             if [ "$(uname -m)" = "loongarch64" ]; then                                                                                                                                                                                     
               echo "✅ 确认在龙芯 loongarch64 机器上运行"                                                                                                                                                                                  
             else                                                                                                                                                                                                                           
               echo "⚠️ 当前不是 loongarch64"                                                                                                                                                                                               
             fi                                                                                                                                                                                                                             
             echo "测试通过"   
